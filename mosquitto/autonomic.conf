per_listener_settings true
persistence true
persistence_location /var/lib/mosquitto/
log_dest syslog

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/autonomic.passwd
acl_file /etc/mosquitto/autonomic.acl

# For communication outside a trusted isolated LAN, enable this listener and
# set tls_ca_cert in config/mqtt.yaml to the matching CA certificate.
# listener 8883 0.0.0.0
# allow_anonymous false
# password_file /etc/mosquitto/autonomic.passwd
# acl_file /etc/mosquitto/autonomic.acl
# cafile /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key
# require_certificate false
