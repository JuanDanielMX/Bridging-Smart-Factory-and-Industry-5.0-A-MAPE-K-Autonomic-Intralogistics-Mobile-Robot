DWAPlannerROS:
  max_vel_x: 0.24
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_trans_vel: 0.24
  min_trans_vel: 0.01
  max_rot_vel: 1.2
  min_rot_vel: 0.25
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 1.5

  xy_goal_tolerance: 0.12
  yaw_goal_tolerance: 0.12
  latch_xy_goal_tolerance: true

  sim_time: 2.0
  vx_samples: 12
  vy_samples: 1
  vth_samples: 30
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.04
  stop_time_buffer: 0.35
  oscillation_reset_dist: 0.10
  forward_point_distance: 0.20
  scaling_speed: 0.15
  max_scaling_factor: 0.20
  publish_traj_pc: true
  publish_cost_grid_pc: true
