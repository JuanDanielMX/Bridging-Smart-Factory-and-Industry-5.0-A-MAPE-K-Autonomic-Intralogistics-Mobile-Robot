transform_tolerance: 0.5
map_type: costmap

# Update this footprint after measuring the installed fork and rear counterweight.
footprint: [[-0.31, -0.28], [-0.31, 0.28], [0.45, 0.28], [0.45, -0.28]]
footprint_padding: 0.02

obstacle_layer:
  enabled: true
  observation_sources: scan
  scan:
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    min_obstacle_height: 0.02
    max_obstacle_height: 1.20
    obstacle_range: 3.0
    raytrace_range: 3.5
    inf_is_valid: true

inflation_layer:
  enabled: true
  inflation_radius: 0.32
  cost_scaling_factor: 4.0

static_layer:
  enabled: true
  map_topic: map
  subscribe_to_updates: true
